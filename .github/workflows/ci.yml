name: Calculator CI/CD

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v7

      - name: Налаштувати Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Запустити тести
        run: python -m unittest -v test_app

  deploy:
    # Запускається лише після успішного завершення тестів.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Симуляція деплою
        run: echo "Deployed"

